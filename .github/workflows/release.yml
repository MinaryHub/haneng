# v* 태그 푸시 시 Windows 패키지를 빌드해 GitHub Release에 첨부한다.
# (macOS·Linux 버전은 0.9.0에서 제거 — 제품은 Windows 전용이다.)
#
# 코드 서명은 인증서 시크릿이 준비되면 활성화:
# - signtool + 인증서 (SmartScreen/백신 오탐 완화)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test before packaging
        run: cargo test --workspace

      - name: Package
        run: pwsh -File scripts/package-windows.ps1

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/haneng-windows.*
